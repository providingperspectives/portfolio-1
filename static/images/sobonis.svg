<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sobonis Enterprise technology platform</title>
  <desc id="desc">A dark blue and cyan architectural visual for Sobonis Enterprise Nig.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="170" fill="#06b6d4" opacity=".18" filter="url(#blur)"/>
  <circle cx="160" cy="650" r="190" fill="#1e40af" opacity=".24" filter="url(#blur)"/>
  <g fill="none" stroke="#334155" stroke-width="1" opacity=".55">
    <path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200"/>
    <path d="M150 0v720M300 0v720M450 0v720M600 0v720M750 0v720M900 0v720M1050 0v720"/>
  </g>
  <path d="M120 510 350 280l190 135 240-240 300 190" fill="none" stroke="url(#glow)" stroke-width="5"/>
  <g fill="#06b6d4">
    <circle cx="120" cy="510" r="9"/><circle cx="350" cy="280" r="9"/><circle cx="540" cy="415" r="9"/>
    <circle cx="780" cy="175" r="9"/><circle cx="1080" cy="365" r="9"/>
  </g>
  <text x="100" y="130" fill="#67e8f9" font-family="Georgia, serif" font-size="28" letter-spacing="7">ENTERPRISE TECHNOLOGY</text>
  <text x="100" y="220" fill="#f8fafc" font-family="Georgia, serif" font-size="86" font-weight="700">SOBONIS</text>
  <text x="105" y="265" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">EVOLVE CREATIVITY</text>
  <text x="100" y="650" fill="#94a3b8" font-family="monospace" font-size="18">FEATURE-DRIVEN / RESEARCH-LED / PERFORMANCE-FIRST</text>
