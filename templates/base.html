<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Portfolio</title>

    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2.0">
</head> <body>
    <header>
        <div class="container">
            <nav>
                <div class="brand">Isiakpona Chuks</div>
                <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul id="nav-menu">
                    <li><a href="{{ url_for('main.home') }}">Home</a></li>
                    <li><a href="{{ url_for('main.about') }}">About</a></li>
                    <li><a href="{{ url_for('main.contact') }}">Contact</a></li>
                    <li><a href="{{ url_for('main.portfolio') }}">Portfolio</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>   
    <footer>
        <p>&copy; 2026 - Isiakpona's Portfolio</p>
    </footer>

    <script>
        // 1. LIGHTBOX / PREVIEW GRAPH PARSER
        function openLightbox(src, title, desc, endpoint){
            const lb = document.getElementById('lightbox');
            if (!lb) return;
            
            lb.querySelector('img').src = src;
            lb.querySelector('.info h3').textContent = title;
            lb.querySelector('.info p').textContent = desc;
            lb.querySelector('.view-link').href = '{{ url_for("main.portfolio") }}/' + endpoint;
            
            lb.classList.add('open');
            lb.setAttribute('aria-hidden','false');
            lb.querySelector('.close').focus();
        }
        
        function closeLightbox(){
            const lb = document.getElementById('lightbox');
            if (lb) {
                lb.classList.remove('open');
                lb.setAttribute('aria-hidden','true');
            }
        }

        // 2. DELEGATED EVENT CAPTURE FOR PROJECT CARDS
        document.addEventListener('click', function(e){
            const thumb = e.target.closest('.thumb-wrap');
            if(thumb){
                const img = thumb.querySelector('img');
                const src = img ? img.src : '';
                const title = thumb.dataset.title || '';
                const desc = thumb.dataset.desc || '';
                const endpoint = thumb.dataset.endpoint || '';
                
                e.preventDefault();
                openLightbox(src, title, desc, endpoint);
            }

            if(e.target.matches('#lightbox') || e.target.closest('#lightbox .close')){
                closeLightbox();
            }
        });

        document.addEventListener('keydown', function(e){
            if(e.key === 'Escape') closeLightbox();
        });
    </script>

    <div id="lightbox" class="lightbox" role="dialog" aria-hidden="true">
        <div class="panel">
            <button class="close" aria-label="Close">✕</button>
            <img src="" alt="Preview">
            <div class="meta">
                <div class="info">
                    <h3></h3>
                    <p></p>
                </div>
                <div class="actions">
                    <a class="btn btn-ghost view-link" href="#">View Project</a>
                </div>
            </div>
        </div>
    </div>

    <button id="agent-chat-toggle" class="agent-chat-fab" aria-label="Open AI Assistant">
        <span>💬</span>
    </button>

    <div id="agent-chat-drawer" class="agent-chat-drawer" aria-hidden="true">
        <div class="agent-drawer-header">
            <h3>System Copilot</h3>
            <button id="agent-drawer-close" aria-label="Close Assistant">✕</button>
        </div>
        
        <div id="agent-chat-messages" class="agent-drawer-body">
            <div class="message system-msg">
                Hello! I am Chuks' Portfolio AI Assistant. Ask me anything about his technical stack, architecture patterns, or projects like MentorQA.
            </div>
        </div>
        
        <div class="agent-drawer-footer">
            <input type="text" id="agent-user-input" placeholder="Ask about Chuks' stack..." autocomplete="off">
            <button id="agent-send-btn">Send</button>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // --- MOBILE NAV SECTIONS ---
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');

        if (hamburger && navMenu) {
            hamburger.addEventListener('click', function(e) {
                e.stopPropagation();
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            });
        }

        // --- DISMISS NAVIGATION ON OUTER CLICK ---
        document.addEventListener('click', function(e) {
            if (navMenu && navMenu.classList.contains('active')) {
                if (!navMenu.contains(e.target) && e.target !== hamburger) {
                    hamburger.classList.remove('active');
                    navMenu.classList.remove('active');
                }
            }
        });

        // --- LINK CLOSING INTERCEPTOR ---
        document.querySelectorAll('#nav-menu li a').forEach(link => {
            link.addEventListener('click', function() {
                if (hamburger) hamburger.classList.remove('active');
                if (navMenu) navMenu.classList.remove('active');
            });
        });

        // --- GLOBAL HERO REDIRECT HOOKS ---
        const heroTrigger = document.getElementById("hero-copilot-trigger");
        const chatFab = document.getElementById("agent-chat-toggle");
        const chatDrawer = document.getElementById("agent-chat-drawer");
        const closeBtn = document.getElementById("agent-drawer-close");
        const sendBtn = document.getElementById("agent-send-btn");
        const userInput = document.getElementById("agent-user-input");
        const messagesContainer = document.getElementById("agent-chat-messages");

        if (heroTrigger && chatFab) {
            heroTrigger.addEventListener("click", function(e) {
                e.preventDefault();
                chatFab.click();
            });
        }

        // --- ASSISTANT ENGINE EVENT DRAWER ---
        if (chatFab && chatDrawer) {
            chatFab.addEventListener("click", function(e) {
                e.stopPropagation();
                e.preventDefault();
                chatDrawer.classList.add("open");
                chatDrawer.setAttribute("aria-hidden", "false");
                if (userInput) userInput.focus();
            });
        }

        if (closeBtn && chatDrawer) {
            closeBtn.addEventListener("click", function(e) {
                e.stopPropagation();
                chatDrawer.classList.remove("open");
                chatDrawer.setAttribute("aria-hidden", "true");
            });
        }

        // --- ASYNC INFERENCE DISPATCH LAYER ---
        async function sendMessage() {
            if (!userInput || !messagesContainer) return;
            
            const queryText = userInput.value.trim();
            if (!queryText) return;

            appendMessage(queryText, "user-msg");
            userInput.value = "";

            const loadingDiv = appendMessage("Thinking...", "system-msg");

            try {
                const response = await fetch("/api/agent/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: queryText })
                });

                const data = await response.json();
                loadingDiv.remove();

                if (response.ok) {
                    appendMessage(data.response, "system-msg");
                } else {
                    appendMessage(data.error || "Systems disruption encountered.", "system-msg");
                }
            } catch (error) {
                if (loadingDiv) loadingDiv.remove();
                appendMessage("Unable to reach inference engine gateway.", "system-msg");
            }
        }

        function appendMessage(text, className) {
            if (!messagesContainer) return;
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return msgDiv;
        }

        if (sendBtn) sendBtn.addEventListener("click", sendMessage);
        if (userInput) {
            userInput.addEventListener("keydown", function(e) {
                if (e.key === "Enter") sendMessage();
            });
        }
    });
    </script>
</body>
</html>
