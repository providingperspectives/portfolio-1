{% extends 'base.html' %}

{% block title %}About{% endblock %}

{% block content %}
    <section class="hero" style="padding-top:12px;padding-bottom:12px">
        <div class="left">
            <h1>About {{ context.name }}</h1>
            <p>{{ context.description }}</p>
            <div style="margin-top:18px" class="badges">
                <span class="badge">Full-Stack</span>
                <span class="badge">Mobile App</span>
                <span class="badge">AI / ML</span>
                <span class="badge">ReactNative</span>
                 <span class="badge">Angular</span>
                  <span class="badge">React</span>
            </div>
        </div>
        <div class="right">
            <img src="{{ url_for('static', filename='images/about.png') }}" alt="About image" style="max-width:320px;border-radius:12px;display:block">
        </div>
    </section>
{% endblock %}
